name: Bug report
description: Report something that does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected behavior vs actual behavior.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command run
      placeholder: asoscope -c jp search "家計簿" --format json
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS: Ubuntu 22.04 / Python: 3.10 / asoscope 1.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
